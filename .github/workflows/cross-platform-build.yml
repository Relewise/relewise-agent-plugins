name: Cross-platform build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-2025
            executable: relewise-agent.exe
          - rid: linux-x64
            runner: ubuntu-24.04
            executable: relewise-agent
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            executable: relewise-agent
          - rid: osx-x64
            runner: macos-15-intel
            executable: relewise-agent
          - rid: osx-arm64
            runner: macos-15
            executable: relewise-agent

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish native executable
        shell: pwsh
        run: |
          $versionCore = (Get-Content -Raw version.json | ConvertFrom-Json).version
          $version = "$versionCore-main.${{ github.run_id }}"
          dotnet publish src/relewise-agent/relewise-agent.csproj --configuration Release --runtime '${{ matrix.rid }}' --output 'artifacts/${{ matrix.rid }}' -p:Version=$version

      - name: Run CLI and packaging smoke tests
        shell: pwsh
        run: |
          $versionCore = (Get-Content -Raw version.json | ConvertFrom-Json).version
          $version = "$versionCore-main.${{ github.run_id }}"
          ./tests/cli/smoke.ps1 -ExecutablePath "artifacts/${{ matrix.rid }}/${{ matrix.executable }}" -ExpectedVersion $version
          ./tools/package/claude.ps1 -RuntimeIdentifier "${{ matrix.rid }}" -ExecutablePath "artifacts/${{ matrix.rid }}/${{ matrix.executable }}"
          ./tests/package/claude.ps1 -RuntimeIdentifier "${{ matrix.rid }}" -PackagePath "artifacts/claude/${{ matrix.rid }}/relewise"
          ./tools/package/github-copilot.ps1 -RuntimeIdentifier "${{ matrix.rid }}" -ExecutablePath "artifacts/${{ matrix.rid }}/${{ matrix.executable }}"
          ./tests/package/github-copilot.ps1 -RuntimeIdentifier "${{ matrix.rid }}" -PackagePath "artifacts/github-copilot/${{ matrix.rid }}/relewise"
          ./tools/package/openai.ps1 -RuntimeIdentifier "${{ matrix.rid }}" -ExecutablePath "artifacts/${{ matrix.rid }}/${{ matrix.executable }}"
          ./tests/package/openai.ps1 -RuntimeIdentifier "${{ matrix.rid }}" -PackagePath "artifacts/openai/${{ matrix.rid }}/relewise"
          ./tools/package/google.ps1 -RuntimeIdentifier "${{ matrix.rid }}" -ExecutablePath "artifacts/${{ matrix.rid }}/${{ matrix.executable }}"
          ./tests/package/google.ps1 -RuntimeIdentifier "${{ matrix.rid }}" -PackagePath "artifacts/google/${{ matrix.rid }}/relewise"

      - name: Run Claude launcher smoke test
        shell: bash
        env:
          CLAUDE_PLUGIN_ROOT: ${{ github.workspace }}/artifacts/claude/${{ matrix.rid }}/relewise
          RELEWISE_AGENT_GATEWAY_TOKEN: smoke-test-token
        run: artifacts/claude/${{ matrix.rid }}/relewise/bin/relewise-agent --version

      - name: Run GitHub Copilot launcher smoke test
        shell: bash
        env:
          COPILOT_PLUGIN_ROOT: ${{ github.workspace }}/artifacts/github-copilot/${{ matrix.rid }}/relewise
          RELEWISE_AGENT_GATEWAY_TOKEN: smoke-test-token
        run: artifacts/github-copilot/${{ matrix.rid }}/relewise/bin/relewise-agent --version

      - name: Run OpenAI Codex launcher smoke test
        shell: bash
        env:
          RELEWISE_AGENT_GATEWAY_TOKEN: smoke-test-token
        run: artifacts/openai/${{ matrix.rid }}/relewise/bin/relewise-agent --version

      - name: Run Google Gemini launcher smoke test
        shell: bash
        env:
          RELEWISE_AGENT_GATEWAY_TOKEN: smoke-test-token
        run: artifacts/google/${{ matrix.rid }}/relewise/bin/relewise-agent --version

      - name: Smoke-test committed marketplace executable
        shell: pwsh
        env:
          RELEWISE_AGENT_GATEWAY_TOKEN: smoke-test-token
        run: |
          $expectedVersion = (Get-Content -Raw plugins/relewise/plugin.json | ConvertFrom-Json).version
          ./tests/cli/smoke.ps1 -ExecutablePath 'plugins/relewise/libexec/${{ matrix.rid }}/${{ matrix.executable }}' -ExpectedVersion $expectedVersion

      - name: Upload native executable for universal package test
        uses: actions/upload-artifact@v7
        with:
          name: ci-native-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}/${{ matrix.executable }}
          if-no-files-found: error

  universal-package:
    name: Validate universal packages
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download native executables
        uses: actions/download-artifact@v7
        with:
          pattern: ci-native-*
          path: artifacts/native

      - name: Assemble and validate universal packages
        shell: pwsh
        run: |
          $versionCore = (Get-Content -Raw version.json | ConvertFrom-Json).version
          $version = "$versionCore-main.${{ github.run_id }}"
          ./tools/package/create-universal-packages.ps1 -ExecutablesRoot artifacts/native -Version $version
          ./tests/package/universal.ps1 -PackagesRoot artifacts/universal -Version $version
          ./tools/package/create-universal-release-archives.ps1 -Version $version

      - name: Smoke-test universal launcher
        shell: bash
        env:
          RELEWISE_AGENT_GATEWAY_TOKEN: smoke-test-token
        run: artifacts/universal/openai/relewise/bin/relewise-agent --version
