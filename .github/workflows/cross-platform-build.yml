name: Cross-platform build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-2025
            executable: relewise-agent.exe
          - rid: linux-x64
            runner: ubuntu-24.04
            executable: relewise-agent
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            executable: relewise-agent
          - rid: osx-x64
            runner: macos-15-intel
            executable: relewise-agent
          - rid: osx-arm64
            runner: macos-15
            executable: relewise-agent

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish native executable
        run: >-
          dotnet publish src/relewise-agent/relewise-agent.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --output artifacts/${{ matrix.rid }}

      - name: Run CLI and packaging smoke tests
        shell: pwsh
        run: |
          ./tests/cli/smoke.ps1 -ExecutablePath "artifacts/${{ matrix.rid }}/${{ matrix.executable }}"
          ./tools/package/claude.ps1 -RuntimeIdentifier "${{ matrix.rid }}" -ExecutablePath "artifacts/${{ matrix.rid }}/${{ matrix.executable }}"
          ./tests/package/claude.ps1 -RuntimeIdentifier "${{ matrix.rid }}" -PackagePath "artifacts/claude/${{ matrix.rid }}/relewise"
          ./tools/package/github-copilot.ps1 -RuntimeIdentifier "${{ matrix.rid }}" -ExecutablePath "artifacts/${{ matrix.rid }}/${{ matrix.executable }}"
          ./tests/package/github-copilot.ps1 -RuntimeIdentifier "${{ matrix.rid }}" -PackagePath "artifacts/github-copilot/${{ matrix.rid }}/relewise"
          ./tools/package/openai.ps1 -RuntimeIdentifier "${{ matrix.rid }}" -ExecutablePath "artifacts/${{ matrix.rid }}/${{ matrix.executable }}"
          ./tests/package/openai.ps1 -RuntimeIdentifier "${{ matrix.rid }}" -PackagePath "artifacts/openai/${{ matrix.rid }}/relewise"
          ./tools/package/google.ps1 -RuntimeIdentifier "${{ matrix.rid }}" -ExecutablePath "artifacts/${{ matrix.rid }}/${{ matrix.executable }}"
          ./tests/package/google.ps1 -RuntimeIdentifier "${{ matrix.rid }}" -PackagePath "artifacts/google/${{ matrix.rid }}/relewise"

      - name: Run Claude launcher smoke test
        shell: bash
        env:
          CLAUDE_PLUGIN_ROOT: ${{ github.workspace }}/artifacts/claude/${{ matrix.rid }}/relewise
          CLAUDE_PLUGIN_OPTION_AGENT_GATEWAY_TOKEN: smoke-test-token
        run: artifacts/claude/${{ matrix.rid }}/relewise/bin/relewise-agent --version

      - name: Run GitHub Copilot launcher smoke test
        shell: bash
        env:
          COPILOT_PLUGIN_ROOT: ${{ github.workspace }}/artifacts/github-copilot/${{ matrix.rid }}/relewise
          RELEWISE_AGENT_GATEWAY_TOKEN: smoke-test-token
        run: artifacts/github-copilot/${{ matrix.rid }}/relewise/bin/relewise-agent --version

      - name: Run OpenAI Codex launcher smoke test
        shell: bash
        env:
          RELEWISE_AGENT_GATEWAY_TOKEN: smoke-test-token
        run: artifacts/openai/${{ matrix.rid }}/relewise/bin/relewise-agent --version

      - name: Run Google Gemini launcher smoke test
        shell: bash
        env:
          RELEWISE_AGENT_GATEWAY_TOKEN: smoke-test-token
        run: artifacts/google/${{ matrix.rid }}/relewise/bin/relewise-agent --version

      - name: Upload native executable for universal package test
        uses: actions/upload-artifact@v7
        with:
          name: ci-native-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}/${{ matrix.executable }}
          if-no-files-found: error

  universal-package:
    name: Validate universal packages
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download native executables
        uses: actions/download-artifact@v7
        with:
          pattern: ci-native-*
          path: artifacts/native

      - name: Assemble and validate universal packages
        shell: pwsh
        run: |
          $fingerprint = (./tools/package/get-codex-marketplace-fingerprint.ps1 | Out-String).Trim()
          $version = "0.3.0-main.${{ github.run_number }}"
          ./tools/package/create-universal-packages.ps1 -ExecutablesRoot artifacts/native -Version $version
          ./tests/package/universal.ps1 -PackagesRoot artifacts/universal -Version $version
          ./tools/package/create-universal-release-archives.ps1 -Version $version

          $marketplaceRoot = 'artifacts/codex-marketplace'
          New-Item -ItemType Directory -Path "$marketplaceRoot/.agents/plugins", "$marketplaceRoot/.claude-plugin", "$marketplaceRoot/.github/plugin", "$marketplaceRoot/plugins" | Out-Null
          Copy-Item -LiteralPath 'vendors/openai/marketplace.json' -Destination "$marketplaceRoot/.agents/plugins/marketplace.json"
          Copy-Item -LiteralPath '.claude-plugin/marketplace.json' -Destination "$marketplaceRoot/.claude-plugin/marketplace.json"
          Copy-Item -LiteralPath '.github/plugin/marketplace.json' -Destination "$marketplaceRoot/.github/plugin/marketplace.json"
          Copy-Item -LiteralPath 'artifacts/universal/openai/relewise' -Destination "$marketplaceRoot/plugins" -Recurse
          Copy-Item -LiteralPath 'artifacts/universal/claude/relewise/.claude-plugin' -Destination "$marketplaceRoot/plugins/relewise" -Recurse
          Copy-Item -LiteralPath 'artifacts/universal/github-copilot/relewise/plugin.json' -Destination "$marketplaceRoot/plugins/relewise/plugin.json"
          [IO.File]::WriteAllText(
            "$marketplaceRoot/plugins/relewise/.codex-plugin/source.sha256",
            "$fingerprint`n",
            [Text.UTF8Encoding]::new($false))
          ./tests/package/codex-marketplace.ps1 -MarketplaceRoot $marketplaceRoot

      - name: Smoke-test universal launcher
        shell: bash
        env:
          RELEWISE_AGENT_GATEWAY_TOKEN: smoke-test-token
        run: artifacts/universal/openai/relewise/bin/relewise-agent --version

      - name: Upload Codex marketplace candidate
        uses: actions/upload-artifact@v7
        with:
          name: codex-marketplace-candidate
          path: artifacts/codex-marketplace
          include-hidden-files: true
          if-no-files-found: error

  update-codex-marketplace:
    name: Update committed Codex marketplace
    needs: universal-package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download validated marketplace
        uses: actions/download-artifact@v7
        with:
          name: codex-marketplace-candidate
          path: artifacts/codex-marketplace

      - name: Restore executable permissions and validate candidate
        shell: bash
        run: |
          chmod +x \
            artifacts/codex-marketplace/plugins/relewise/bin/relewise-agent \
            artifacts/codex-marketplace/plugins/relewise/libexec/linux-x64/relewise-agent \
            artifacts/codex-marketplace/plugins/relewise/libexec/linux-arm64/relewise-agent \
            artifacts/codex-marketplace/plugins/relewise/libexec/osx-x64/relewise-agent \
            artifacts/codex-marketplace/plugins/relewise/libexec/osx-arm64/relewise-agent
          pwsh ./tests/package/codex-marketplace.ps1 -MarketplaceRoot artifacts/codex-marketplace

      - name: Open or update generated marketplace pull request
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $candidate = 'artifacts/codex-marketplace/plugins/relewise'
          $target = 'plugins/relewise'
          $candidateFingerprint = (Get-Content -Raw -LiteralPath "$candidate/.codex-plugin/source.sha256").Trim()
          $currentFingerprint = if (Test-Path -LiteralPath "$target/.codex-plugin/source.sha256") {
            (Get-Content -Raw -LiteralPath "$target/.codex-plugin/source.sha256").Trim()
          } else { '' }
          if ($candidateFingerprint -eq $currentFingerprint) {
            Write-Host 'Committed Codex marketplace payload is current.'
            exit 0
          }

          $branch = 'automation/update-codex-marketplace'
          git switch -C $branch
          New-Item -ItemType Directory -Force -Path "$target/.codex-plugin", "$target/.claude-plugin", "$target/bin", "$target/libexec" | Out-Null
          Copy-Item -LiteralPath "$candidate/.codex-plugin/plugin.json" -Destination "$target/.codex-plugin/plugin.json" -Force
          Copy-Item -LiteralPath "$candidate/.codex-plugin/source.sha256" -Destination "$target/.codex-plugin/source.sha256" -Force
          Copy-Item -LiteralPath "$candidate/.claude-plugin/plugin.json" -Destination "$target/.claude-plugin/plugin.json" -Force
          Copy-Item -LiteralPath "$candidate/plugin.json" -Destination "$target/plugin.json" -Force
          Copy-Item -LiteralPath "$candidate/bin/relewise-agent" -Destination "$target/bin/relewise-agent" -Force
          foreach ($rid in @('win-x64', 'linux-x64', 'linux-arm64', 'osx-x64', 'osx-arm64')) {
            $name = if ($rid -eq 'win-x64') { 'relewise-agent.exe' } else { 'relewise-agent' }
            New-Item -ItemType Directory -Force -Path "$target/libexec/$rid" | Out-Null
            Copy-Item -LiteralPath "$candidate/libexec/$rid/$name" -Destination "$target/libexec/$rid/$name" -Force
          }
          Copy-Item -LiteralPath 'LICENSE' -Destination "$target/LICENSE" -Force

          git add -- plugins/relewise/plugin.json plugins/relewise/.codex-plugin plugins/relewise/.claude-plugin plugins/relewise/bin plugins/relewise/libexec plugins/relewise/LICENSE
          git update-index --chmod=+x plugins/relewise/bin/relewise-agent plugins/relewise/libexec/linux-x64/relewise-agent plugins/relewise/libexec/linux-arm64/relewise-agent plugins/relewise/libexec/osx-x64/relewise-agent plugins/relewise/libexec/osx-arm64/relewise-agent
          if (git diff --cached --quiet) {
            Write-Host 'No generated marketplace changes to commit.'
            exit 0
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update committed marketplace payload'
          git push --force origin $branch

          $existing = gh pr list --head $branch --base main --state open --json number --jq '.[0].number'
          if ([string]::IsNullOrWhiteSpace($existing)) {
            gh pr create --head $branch --base main --title 'Update committed marketplace payload' --body 'Automated refresh of the five NativeAOT executables and vendor manifests from the current canonical source. No reviewers are requested automatically.'
          } else {
            Write-Host "Updated existing PR #$existing."
          }
