name: Cross-platform build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-fingerprint:
    name: Check runtime freshness
    runs-on: ubuntu-latest
    outputs:
      refresh-needed: ${{ steps.fingerprint.outputs.refresh-needed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Compare runtime inputs with committed executables
        id: fingerprint
        shell: pwsh
        run: |
          $actual = (./tools/package/get-runtime-fingerprint.ps1 | Out-String).Trim()
          $expected = (Get-Content -Raw plugins/relewise/.codex-plugin/runtime-source.sha256).Trim()
          $needed = if ($actual -eq $expected) { 'false' } else { 'true' }
          "refresh-needed=$needed" >> $env:GITHUB_OUTPUT
          Write-Host "Runtime build needed: $needed"

  build:
    name: Validate ${{ matrix.rid }}
    needs: runtime-fingerprint
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-2025
            executable: relewise-agent.exe
          - rid: linux-x64
            runner: ubuntu-24.04
            executable: relewise-agent
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            executable: relewise-agent
          - rid: osx-x64
            runner: macos-15-intel
            executable: relewise-agent
          - rid: osx-arm64
            runner: macos-15
            executable: relewise-agent

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        if: needs.runtime-fingerprint.outputs.refresh-needed == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish native executable
        if: needs.runtime-fingerprint.outputs.refresh-needed == 'true'
        shell: pwsh
        run: |
          $versionCore = (Get-Content -Raw version.json | ConvertFrom-Json).version
          $version = "$versionCore-main.${{ github.run_id }}"
          dotnet publish src/relewise-agent/relewise-agent.csproj --configuration Release --runtime '${{ matrix.rid }}' --output 'artifacts/${{ matrix.rid }}' -p:Version=$version

      - name: Run CLI and packaging smoke tests
        shell: pwsh
        run: |
          $runtimeBuildNeeded = '${{ needs.runtime-fingerprint.outputs.refresh-needed }}' -eq 'true'
          if ($runtimeBuildNeeded) {
            $versionCore = (Get-Content -Raw version.json | ConvertFrom-Json).version
            $expectedVersion = "$versionCore-main.${{ github.run_id }}"
            $executable = "artifacts/${{ matrix.rid }}/${{ matrix.executable }}"
          } else {
            $expectedVersion = (Get-Content -Raw plugins/relewise/.codex-plugin/runtime-version.txt).Trim()
            $executable = "plugins/relewise/libexec/${{ matrix.rid }}/${{ matrix.executable }}"
          }
          ./tests/cli/smoke.ps1 -ExecutablePath $executable -ExpectedVersion $expectedVersion
          ./tools/package/claude.ps1 -RuntimeIdentifier "${{ matrix.rid }}" -ExecutablePath $executable
          ./tests/package/claude.ps1 -RuntimeIdentifier "${{ matrix.rid }}" -PackagePath "artifacts/claude/${{ matrix.rid }}/relewise"
          ./tools/package/github-copilot.ps1 -RuntimeIdentifier "${{ matrix.rid }}" -ExecutablePath $executable
          ./tests/package/github-copilot.ps1 -RuntimeIdentifier "${{ matrix.rid }}" -PackagePath "artifacts/github-copilot/${{ matrix.rid }}/relewise"
          ./tools/package/openai.ps1 -RuntimeIdentifier "${{ matrix.rid }}" -ExecutablePath $executable
          ./tests/package/openai.ps1 -RuntimeIdentifier "${{ matrix.rid }}" -PackagePath "artifacts/openai/${{ matrix.rid }}/relewise"
          ./tools/package/google.ps1 -RuntimeIdentifier "${{ matrix.rid }}" -ExecutablePath $executable
          ./tests/package/google.ps1 -RuntimeIdentifier "${{ matrix.rid }}" -PackagePath "artifacts/google/${{ matrix.rid }}/relewise"
          $stagedExecutable = "artifacts/ci-native/${{ matrix.rid }}/${{ matrix.executable }}"
          New-Item -ItemType Directory -Force -Path (Split-Path $stagedExecutable) | Out-Null
          Copy-Item -LiteralPath $executable -Destination $stagedExecutable

      - name: Run Claude launcher smoke test
        shell: bash
        env:
          CLAUDE_PLUGIN_ROOT: ${{ github.workspace }}/artifacts/claude/${{ matrix.rid }}/relewise
          RELEWISE_AGENT_GATEWAY_TOKEN: smoke-test-token
        run: artifacts/claude/${{ matrix.rid }}/relewise/scripts/relewise-agent --version

      - name: Run GitHub Copilot launcher smoke test
        shell: bash
        env:
          COPILOT_PLUGIN_ROOT: ${{ github.workspace }}/artifacts/github-copilot/${{ matrix.rid }}/relewise
          RELEWISE_AGENT_GATEWAY_TOKEN: smoke-test-token
        run: artifacts/github-copilot/${{ matrix.rid }}/relewise/scripts/relewise-agent --version

      - name: Run OpenAI Codex launcher smoke test
        shell: bash
        env:
          RELEWISE_AGENT_GATEWAY_TOKEN: smoke-test-token
        run: artifacts/openai/${{ matrix.rid }}/relewise/scripts/relewise-agent --version

      - name: Run Google Gemini launcher smoke test
        shell: bash
        env:
          RELEWISE_AGENT_GATEWAY_TOKEN: smoke-test-token
        run: artifacts/google/${{ matrix.rid }}/relewise/scripts/relewise-agent --version

      - name: Upload native executable for universal package test
        uses: actions/upload-artifact@v7
        with:
          name: ci-native-${{ matrix.rid }}
          path: artifacts/ci-native/${{ matrix.rid }}/${{ matrix.executable }}
          if-no-files-found: error

  claude-plugin-archive:
    name: Validate Claude plugin archive
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download native executables
        uses: actions/download-artifact@v7
        with:
          pattern: ci-native-*
          path: artifacts/native

      - name: Assemble and validate vendor packages
        shell: pwsh
        run: |
          $versionCore = (Get-Content -Raw version.json | ConvertFrom-Json).version
          $version = "$versionCore-main.${{ github.run_id }}"
          ./tools/package/create-universal-packages.ps1 -ExecutablesRoot artifacts/native -Version $version
          ./tests/package/universal.ps1 -PackagesRoot artifacts/universal -Version $version
          ./tools/package/create-claude-plugin-archive.ps1 -PluginName relewise -Version $version -PluginRoot artifacts/universal/claude/relewise

      - name: Extract and verify Claude plugin archive
        shell: bash
        run: |
          versionCore="$(jq -r .version version.json)"
          version="${versionCore}-main.${{ github.run_id }}"
          mkdir -p artifacts/extracted/relewise
          unzip -q "artifacts/release-plugin/relewise-claude-plugin-v${version}.zip" -d artifacts/extracted/relewise
          test -x artifacts/extracted/relewise/scripts/relewise-agent
          test -x artifacts/extracted/relewise/libexec/linux-x64/relewise-agent

      - name: Validate extracted Claude plugin
        shell: pwsh
        run: |
          $versionCore = (Get-Content -Raw version.json | ConvertFrom-Json).version
          $version = "$versionCore-main.${{ github.run_id }}"
          ./tests/package/claude-plugin-archive.ps1 -PluginRoot artifacts/extracted/relewise -Version $version

      - name: Smoke-test Claude plugin launcher
        shell: bash
        env:
          RELEWISE_AGENT_GATEWAY_TOKEN: smoke-test-token
        run: artifacts/extracted/relewise/scripts/relewise-agent --version
