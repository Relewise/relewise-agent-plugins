name: Refresh marketplace payload

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: refresh-marketplace-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-branch:
    name: Validate target branch
    runs-on: ubuntu-latest
    outputs:
      refresh-needed: ${{ steps.fingerprint.outputs.refresh-needed }}
      runtime-refresh-needed: ${{ steps.fingerprint.outputs.runtime-refresh-needed }}
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7

      - name: Refuse main
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "Refresh a feature branch so the generated payload is reviewed and merged atomically."
            exit 1
          fi

      - name: Check whether refresh is needed
        id: fingerprint
        shell: pwsh
        run: |
          $actual = (./tools/package/get-codex-marketplace-fingerprint.ps1 | Out-String).Trim()
          $expected = (Get-Content -Raw plugins/relewise/.codex-plugin/source.sha256).Trim()
          $needed = if ($actual -eq $expected) { 'false' } else { 'true' }
          $runtimeActual = (./tools/package/get-runtime-fingerprint.ps1 | Out-String).Trim()
          $runtimeExpected = (Get-Content -Raw plugins/relewise/.codex-plugin/runtime-source.sha256).Trim()
          $runtimeNeeded = if ($runtimeActual -eq $runtimeExpected) { 'false' } else { 'true' }
          "refresh-needed=$needed" >> $env:GITHUB_OUTPUT
          "runtime-refresh-needed=$runtimeNeeded" >> $env:GITHUB_OUTPUT
          Write-Host "Refresh needed: $needed"
          Write-Host "Runtime refresh needed: $runtimeNeeded"

  build:
    name: Build ${{ matrix.rid }}
    needs: validate-branch
    if: needs.validate-branch.outputs.runtime-refresh-needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-2025
            executable: relewise-agent.exe
          - rid: linux-x64
            runner: ubuntu-24.04
            executable: relewise-agent
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            executable: relewise-agent
          - rid: osx-x64
            runner: macos-15-intel
            executable: relewise-agent
          - rid: osx-arm64
            runner: macos-15
            executable: relewise-agent
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build and smoke-test native executable
        shell: pwsh
        run: |
          $versionCore = (Get-Content -Raw version.json | ConvertFrom-Json).version
          $version = "$versionCore-main.${{ github.run_id }}"
          dotnet publish src/relewise-agent/relewise-agent.csproj --configuration Release --runtime '${{ matrix.rid }}' --output 'artifacts/${{ matrix.rid }}' -p:Version=$version
          ./tests/cli/smoke.ps1 -ExecutablePath 'artifacts/${{ matrix.rid }}/${{ matrix.executable }}' -ExpectedVersion $version

      - name: Upload native executable
        uses: actions/upload-artifact@v7
        with:
          name: refresh-native-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}/${{ matrix.executable }}
          if-no-files-found: error

  update-feature-branch:
    name: Commit marketplace payload to feature branch
    needs: [validate-branch, build]
    if: always() && needs.validate-branch.outputs.refresh-needed == 'true' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download native executables
        if: needs.validate-branch.outputs.runtime-refresh-needed == 'true'
        uses: actions/download-artifact@v7
        with:
          pattern: refresh-native-*
          path: artifacts/native

      - name: Assemble and validate committed payload
        shell: pwsh
        run: |
          $versionCore = (Get-Content -Raw version.json | ConvertFrom-Json).version
          $version = "$versionCore-main.${{ github.run_id }}"
          $runtimeRefreshNeeded = '${{ needs.validate-branch.outputs.runtime-refresh-needed }}' -eq 'true'
          $executablesRoot = if ($runtimeRefreshNeeded) { 'artifacts/native' } else { 'plugins/relewise/libexec' }
          ./tools/package/create-universal-packages.ps1 -ExecutablesRoot $executablesRoot -Version $version
          foreach ($vendor in @('claude', 'github-copilot', 'openai')) {
            ./tools/package/relewise-developer.ps1 -Vendor $vendor -Version $version -OutputRoot "artifacts/developer/$vendor"
          }

          $candidate = 'artifacts/universal'
          $target = 'plugins/relewise'
          Copy-Item -LiteralPath "$candidate/openai/relewise/.codex-plugin/plugin.json" -Destination "$target/.codex-plugin/plugin.json" -Force
          Copy-Item -LiteralPath "$candidate/claude/relewise/.claude-plugin/plugin.json" -Destination "$target/.claude-plugin/plugin.json" -Force
          Copy-Item -LiteralPath "$candidate/github-copilot/relewise/plugin.json" -Destination "$target/plugin.json" -Force
          Copy-Item -LiteralPath "$candidate/openai/relewise/scripts/relewise-agent" -Destination "$target/scripts/relewise-agent" -Force
          if ($runtimeRefreshNeeded) {
            foreach ($rid in @('win-x64', 'linux-x64', 'linux-arm64', 'osx-x64', 'osx-arm64')) {
              $name = if ($rid -eq 'win-x64') { 'relewise-agent.exe' } else { 'relewise-agent' }
              Copy-Item -LiteralPath "$candidate/openai/relewise/libexec/$rid/$name" -Destination "$target/libexec/$rid/$name" -Force
            }
            $runtimeFingerprint = (./tools/package/get-runtime-fingerprint.ps1 | Out-String).Trim()
            [IO.File]::WriteAllText(
              "$target/.codex-plugin/runtime-source.sha256",
              "$runtimeFingerprint`n",
              [Text.UTF8Encoding]::new($false))
            [IO.File]::WriteAllText(
              "$target/.codex-plugin/runtime-version.txt",
              "$version`n",
              [Text.UTF8Encoding]::new($false))
          }
          Copy-Item -LiteralPath 'LICENSE' -Destination "$target/LICENSE" -Force

          $developerTarget = 'plugins/relewise-developer'
          Copy-Item -LiteralPath 'artifacts/developer/openai/relewise-developer/.codex-plugin/plugin.json' -Destination "$developerTarget/.codex-plugin/plugin.json" -Force
          Copy-Item -LiteralPath 'artifacts/developer/claude/relewise-developer/.claude-plugin/plugin.json' -Destination "$developerTarget/.claude-plugin/plugin.json" -Force
          Copy-Item -LiteralPath 'artifacts/developer/github-copilot/relewise-developer/plugin.json' -Destination "$developerTarget/plugin.json" -Force

          # Calculate after every generated file is in its committed path. The portable
          # manifest version is ignored to avoid a circular fingerprint dependency.
          $fingerprint = (./tools/package/get-codex-marketplace-fingerprint.ps1 | Out-String).Trim()
          [IO.File]::WriteAllText(
            "$target/.codex-plugin/source.sha256",
            "$fingerprint`n",
            [Text.UTF8Encoding]::new($false))

          ./tests/package/marketplace-fingerprint.ps1
          ./tests/package/codex-marketplace.ps1 -MarketplaceRoot .
          foreach ($vendor in @('claude', 'github-copilot', 'openai')) {
            ./tests/package/relewise-developer.ps1 -Vendor $vendor -PackagePath "artifacts/developer/$vendor/relewise-developer" -Version $version
          }

      - name: Commit and push to the originating branch
        shell: bash
        run: |
          git add -- \
            plugins/relewise/plugin.json \
            plugins/relewise/.codex-plugin \
            plugins/relewise/.claude-plugin \
            plugins/relewise/scripts \
            plugins/relewise/libexec \
            plugins/relewise/LICENSE \
            plugins/relewise-developer/plugin.json \
            plugins/relewise-developer/.codex-plugin \
            plugins/relewise-developer/.claude-plugin
          git update-index --chmod=+x \
            plugins/relewise/scripts/relewise-agent \
            plugins/relewise/libexec/linux-x64/relewise-agent \
            plugins/relewise/libexec/linux-arm64/relewise-agent \
            plugins/relewise/libexec/osx-x64/relewise-agent \
            plugins/relewise/libexec/osx-arm64/relewise-agent
          # Artifacts are assembled on Linux, so explicitly keep the Windows binary non-executable in Git.
          git update-index --chmod=-x plugins/relewise/libexec/win-x64/relewise-agent.exe
          if git diff --cached --quiet; then
            echo "Marketplace payload is already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh committed marketplace payload'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Run checks on the updated PR head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run contract-validation.yml --ref "${GITHUB_REF_NAME}"
          gh workflow run cross-platform-build.yml --ref "${GITHUB_REF_NAME}"
          gh workflow run agent-gateway-integration.yml --ref "${GITHUB_REF_NAME}"
