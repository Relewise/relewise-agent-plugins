name: Agent Gateway integration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-gateway-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Live Agent Gateway integration
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      RELEWISE_AGENT_GATEWAY_TOKEN: ${{ secrets.RELEWISE_AGENT_GATEWAY_TEST_TOKEN }}
      RELEWISE_AGENT_GATEWAY_TEST_DATASET_ID_PRIMARY: ${{ vars.RELEWISE_AGENT_GATEWAY_TEST_DATASET_ID_PRIMARY }}
      RELEWISE_AGENT_GATEWAY_TEST_DATASET_ID_SECONDARY: ${{ vars.RELEWISE_AGENT_GATEWAY_TEST_DATASET_ID_SECONDARY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish native executable
        run: >-
          dotnet publish src/relewise-agent/relewise-agent.csproj
          --configuration Release
          --runtime linux-x64
          --output artifacts/linux-x64

      - name: Run live integration tests
        shell: pwsh
        run: >-
          ./tests/integration/live.ps1
          -ExecutablePath artifacts/linux-x64/relewise-agent
