name: Contract validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  marketplace-fingerprint:
    name: Validate marketplace fingerprint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify committed marketplace payload is current
        shell: pwsh
        run: ./tests/package/marketplace-fingerprint.ps1

  claude-marketplace:
    name: Validate Claude marketplace
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Claude Code validator
        run: npm install --global @anthropic-ai/claude-code@2.1.260

      - name: Validate marketplace, plugin, and skills
        run: |
          claude plugin validate .
          claude plugin validate ./plugins/relewise
          claude plugin validate ./plugins/relewise-developer

      - name: Smoke-test marketplace installation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'relewise-claude-config'
          New-Item -ItemType Directory -Force -Path $env:CLAUDE_CONFIG_DIR | Out-Null

          claude plugin marketplace add $env:GITHUB_WORKSPACE --scope user
          if ($LASTEXITCODE -ne 0) { throw 'Claude failed to add the repository marketplace.' }
          claude plugin install relewise@relewise --scope user
          if ($LASTEXITCODE -ne 0) { throw 'Claude failed to install the Relewise plugin.' }
          claude plugin install relewise-developer@relewise --scope user
          if ($LASTEXITCODE -ne 0) { throw 'Claude failed to install the Relewise Developer plugin.' }

          $installedPlugins = (claude plugin list --json | Out-String) | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Claude failed to list installed plugins.' }
          $plugin = @($installedPlugins) | Where-Object { $_.id -eq 'relewise@relewise' }
          if ($plugin.Count -ne 1 -or -not $plugin[0].enabled) {
            throw 'The installed Relewise plugin is missing or disabled.'
          }

          $installedRoot = $plugin[0].installPath
          $expectedSkills = Get-ChildItem -LiteralPath 'plugins/relewise/skills' -Directory | Select-Object -ExpandProperty Name
          $installedSkills = Get-ChildItem -LiteralPath (Join-Path $installedRoot 'skills') -Directory | Select-Object -ExpandProperty Name
          $skillDifference = Compare-Object $expectedSkills $installedSkills
          if ($null -ne $skillDifference) {
            throw "The installed Claude plugin does not contain the canonical skill set: $($skillDifference | Out-String)"
          }

          $env:CLAUDE_PLUGIN_ROOT = $installedRoot
          $launcher = Join-Path $installedRoot 'scripts/relewise-agent'
          $versionResponse = (& $launcher --version | Out-String) | ConvertFrom-Json
          if (-not $versionResponse.success -or $versionResponse.data.name -ne 'relewise-agent') {
            throw 'The installed Claude launcher did not return a valid version response.'
          }

          $developerPlugin = @($installedPlugins) | Where-Object { $_.id -eq 'relewise-developer@relewise' }
          if ($developerPlugin.Count -ne 1 -or -not $developerPlugin[0].enabled) {
            throw 'The installed Relewise Developer plugin is missing or disabled.'
          }
          $developerRoot = $developerPlugin[0].installPath
          if (-not (Test-Path -LiteralPath (Join-Path $developerRoot 'skills/relewise-development/SKILL.md'))) {
            throw 'The installed Relewise Developer plugin is missing its development skill.'
          }
          $developerMcp = Get-Content -Raw -LiteralPath (Join-Path $developerRoot '.mcp.json') | ConvertFrom-Json
          if ($developerMcp.mcpServers.'relewise-developer'.url -ne 'https://mcp.relewise.com') {
            throw 'The installed Relewise Developer plugin has the wrong MCP endpoint.'
          }

  validate:
    name: Validate contract
    needs: marketplace-fingerprint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Agent Skills reference validator
        run: python -m pip install skills-ref==0.1.1

      - name: Build generator
        run: dotnet build tools/generate-contract/generate-contract.csproj --configuration Release

      - name: Regenerate contract catalog
        run: dotnet run --project tools/generate-contract/generate-contract.csproj --configuration Release --no-build

      - name: Verify generated files are current
        shell: bash
        run: |
          status="$(git status --porcelain --untracked-files=all -- generated)"
          if [[ -n "$status" ]]; then
            echo "Generated contract files are not current. Run:"
            echo "dotnet run --project tools/generate-contract"
            echo "$status"
            git diff -- generated
            exit 1
          fi

      - name: Validate skill operation references
        run: dotnet run --project tools/validate-skills/validate-skills.csproj --configuration Release

      - name: Validate Agent Skills specification
        shell: pwsh
        run: |
          ./tools/validate-agent-skills/validate-agent-skills.ps1
          ./tools/validate-agent-skills/validate-agent-skills.ps1 -PluginsRoot .agents/skills

      - name: Validate portable plugin manifests
        run: dotnet run --project tools/validate-agent-plugins/validate-agent-plugins.csproj --configuration Release

      - name: Validate committed vendor marketplaces
        shell: pwsh
        run: |
          ./tests/package/codex-marketplace.ps1 -MarketplaceRoot .
          $version = (Get-Content -Raw version.json | ConvertFrom-Json).version
          foreach ($vendor in @('claude', 'github-copilot', 'openai')) {
            ./tools/package/relewise-developer.ps1 -Vendor $vendor -Version $version -OutputRoot "artifacts/developer/$vendor"
            ./tests/package/relewise-developer.ps1 -Vendor $vendor -PackagePath "artifacts/developer/$vendor/relewise-developer" -Version $version
          }

      - name: Generate API coverage
        run: dotnet run --project tools/generate-coverage/generate-coverage.csproj --configuration Release

      - name: Verify API coverage files are current
        shell: bash
        run: |
          status="$(git status --porcelain --untracked-files=all -- generated/operation-coverage.json docs/api-coverage.md)"
          if [[ -n "$status" ]]; then
            echo "API coverage files are not current. Run:"
            echo "dotnet run --project tools/generate-coverage"
            echo "$status"
            git diff -- generated/operation-coverage.json docs/api-coverage.md
            exit 1
          fi
