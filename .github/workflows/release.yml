name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest

    steps:
      - name: Validate version tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use v<major>.<minor>.<patch>."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify tag matches planned version
        shell: pwsh
        run: |
          $planned = (Get-Content -Raw version.json | ConvertFrom-Json).version
          $tagVersion = '${{ github.ref_name }}'.Substring(1)
          if ($tagVersion -ne $planned) {
            throw "Release tag version '$tagVersion' does not match version.json '$planned'."
          }

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Agent Skills reference validator
        run: python -m pip install skills-ref==0.1.1

      - name: Regenerate contract catalog
        run: dotnet run --project tools/generate-contract/generate-contract.csproj --configuration Release

      - name: Validate generated contract files
        shell: bash
        run: |
          status="$(git status --porcelain --untracked-files=all -- generated)"
          if [[ -n "$status" ]]; then
            echo "Generated contract files are not current."
            echo "$status"
            exit 1
          fi

      - name: Validate skills
        run: dotnet run --project tools/validate-skills/validate-skills.csproj --configuration Release

      - name: Validate Agent Skills specification
        shell: pwsh
        run: ./tools/validate-agent-skills/validate-agent-skills.ps1

      - name: Validate portable plugin manifests
        run: dotnet run --project tools/validate-agent-plugins/validate-agent-plugins.csproj --configuration Release

      - name: Regenerate API coverage
        run: dotnet run --project tools/generate-coverage/generate-coverage.csproj --configuration Release

      - name: Validate API coverage files
        shell: bash
        run: |
          status="$(git status --porcelain --untracked-files=all -- generated/operation-coverage.json docs/api-coverage.md)"
          if [[ -n "$status" ]]; then
            echo "API coverage files are not current."
            echo "$status"
            exit 1
          fi

  package:
    name: Package ${{ matrix.rid }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-2025
            executable: relewise-agent.exe
          - rid: linux-x64
            runner: ubuntu-24.04
            executable: relewise-agent
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            executable: relewise-agent
          - rid: osx-x64
            runner: macos-15-intel
            executable: relewise-agent
          - rid: osx-arm64
            runner: macos-15
            executable: relewise-agent

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build, package and test
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.Substring(1)
          $executable = "artifacts/${{ matrix.rid }}/${{ matrix.executable }}"

          dotnet publish src/relewise-agent/relewise-agent.csproj --configuration Release --runtime '${{ matrix.rid }}' --output 'artifacts/${{ matrix.rid }}' -p:Version=$version
          ./tests/cli/smoke.ps1 -ExecutablePath $executable -ExpectedVersion $version

          ./tools/package/claude.ps1 -RuntimeIdentifier '${{ matrix.rid }}' -ExecutablePath $executable
          ./tools/package/github-copilot.ps1 -RuntimeIdentifier '${{ matrix.rid }}' -ExecutablePath $executable
          ./tools/package/openai.ps1 -RuntimeIdentifier '${{ matrix.rid }}' -ExecutablePath $executable
          ./tools/package/google.ps1 -RuntimeIdentifier '${{ matrix.rid }}' -ExecutablePath $executable

          ./tools/package/set-manifest-version.ps1 -ManifestPath 'artifacts/claude/${{ matrix.rid }}/relewise/.claude-plugin/plugin.json' -Version $version
          ./tools/package/set-manifest-version.ps1 -ManifestPath 'artifacts/github-copilot/${{ matrix.rid }}/relewise/plugin.json' -Version $version
          ./tools/package/set-manifest-version.ps1 -ManifestPath 'artifacts/openai/${{ matrix.rid }}/relewise/.codex-plugin/plugin.json' -Version $version
          ./tools/package/set-manifest-version.ps1 -ManifestPath 'artifacts/google/${{ matrix.rid }}/relewise/gemini-extension.json' -Version $version

          ./tests/package/claude.ps1 -RuntimeIdentifier '${{ matrix.rid }}' -PackagePath 'artifacts/claude/${{ matrix.rid }}/relewise'
          ./tests/package/github-copilot.ps1 -RuntimeIdentifier '${{ matrix.rid }}' -PackagePath 'artifacts/github-copilot/${{ matrix.rid }}/relewise'
          ./tests/package/openai.ps1 -RuntimeIdentifier '${{ matrix.rid }}' -PackagePath 'artifacts/openai/${{ matrix.rid }}/relewise'
          ./tests/package/google.ps1 -RuntimeIdentifier '${{ matrix.rid }}' -PackagePath 'artifacts/google/${{ matrix.rid }}/relewise'

          ./tools/package/create-gemini-release-archive.ps1 -RuntimeIdentifier '${{ matrix.rid }}'

      - name: Smoke-test packaged launchers
        shell: bash
        env:
          CLAUDE_PLUGIN_ROOT: ${{ github.workspace }}/artifacts/claude/${{ matrix.rid }}/relewise
          COPILOT_PLUGIN_ROOT: ${{ github.workspace }}/artifacts/github-copilot/${{ matrix.rid }}/relewise
          RELEWISE_AGENT_GATEWAY_TOKEN: smoke-test-token
        run: |
          artifacts/claude/${{ matrix.rid }}/relewise/scripts/relewise-agent --version
          artifacts/github-copilot/${{ matrix.rid }}/relewise/scripts/relewise-agent --version
          artifacts/openai/${{ matrix.rid }}/relewise/scripts/relewise-agent --version
          artifacts/google/${{ matrix.rid }}/relewise/scripts/relewise-agent --version

      - name: Upload Gemini release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/release/*
          if-no-files-found: error

      - name: Upload native executable
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}/${{ matrix.executable }}
          if-no-files-found: error

  assemble-claude-plugin:
    name: Assemble Claude plugin archive
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download native executables
        uses: actions/download-artifact@v7
        with:
          pattern: native-*
          path: artifacts/native

      - name: Assemble and validate vendor packages
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.Substring(1)
          ./tools/package/create-universal-packages.ps1 -ExecutablesRoot artifacts/native -Version $version
          ./tests/package/universal.ps1 -PackagesRoot artifacts/universal -Version $version
          ./tools/package/relewise-developer.ps1 -Vendor claude -Version $version -OutputRoot artifacts/universal/claude
          ./tests/package/relewise-developer.ps1 -Vendor claude -PackagePath artifacts/universal/claude/relewise-developer -Version $version
          ./tools/package/create-claude-plugin-archive.ps1 -PluginName relewise -Version $version -PluginRoot artifacts/universal/claude/relewise
          ./tools/package/create-claude-plugin-archive.ps1 -PluginName relewise-developer -Version $version -PluginRoot artifacts/universal/claude/relewise-developer

      - name: Install Claude Code validator
        run: npm install --global @anthropic-ai/claude-code@2.1.260

      - name: Extract and verify Claude plugin archive
        shell: bash
        run: |
          mkdir -p artifacts/extracted/relewise
          mkdir -p artifacts/extracted/relewise-developer
          unzip -q "artifacts/release-plugin/relewise-claude-plugin-v${GITHUB_REF_NAME#v}.zip" -d artifacts/extracted/relewise
          unzip -q "artifacts/release-plugin/relewise-developer-claude-plugin-v${GITHUB_REF_NAME#v}.zip" -d artifacts/extracted/relewise-developer
          test -x artifacts/extracted/relewise/scripts/relewise-agent
          test -x artifacts/extracted/relewise/libexec/linux-x64/relewise-agent

      - name: Validate extracted Claude plugin
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.Substring(1)
          ./tests/package/claude-plugin-archive.ps1 -PluginRoot artifacts/extracted/relewise -Version $version
          ./tests/package/relewise-developer.ps1 -Vendor claude -PackagePath artifacts/extracted/relewise-developer -Version $version
          claude plugin validate artifacts/extracted/relewise
          claude plugin validate artifacts/extracted/relewise-developer

      - name: Smoke-test Claude plugin launcher
        shell: bash
        env:
          RELEWISE_AGENT_GATEWAY_TOKEN: smoke-test-token
        run: artifacts/extracted/relewise/scripts/relewise-agent --version

      - name: Upload Claude plugin archive
        uses: actions/upload-artifact@v7
        with:
          name: release-plugin
          path: artifacts/release-plugin/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [package, assemble-claude-plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          expected=(
            darwin.arm64.relewise.tar.gz
            darwin.x64.relewise.tar.gz
            linux.arm64.relewise.tar.gz
            linux.x64.relewise.tar.gz
            win32.x64.relewise.zip
            "relewise-claude-plugin-v${version}.zip"
            "relewise-developer-claude-plugin-v${version}.zip"
          )
          mapfile -t actual < <(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "${actual[*]}" != "${wanted[*]}" ]]; then
            echo "Release assets do not match the seven supported distributions."
            printf 'Expected: %s\n' "${wanted[@]}"
            printf 'Actual: %s\n' "${actual[@]}"
            exit 1
          fi
          prerelease=()
          if [[ "${GITHUB_REF_NAME}" == v0.* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/* \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}" \
            "${prerelease[@]}"
